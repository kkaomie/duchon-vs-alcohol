<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="theme-color" content="#1a7e28">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Duchon Game">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
    <title>Duchoň vs Alcohol</title>
    <style>
        #warning-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: #ff4444;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            z-index: 1000;
            display: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        body.show-warning {
            padding-top: 60px;
        }
        
        body.show-warning #warning-banner {
            display: block;
        }
    </style>
</head>
<body>
    <div id="warning-banner">
         ⚠️🥵🦶🏿🦄 hej inac kvoli nedostatocnym eurofondom (prioritu ma jachta) hra nefunguje V CHROME, MUSIS SI JU STIAHNUT (ako nainstalovat PWA)
    </div>

    <div id="home-screen" class="screen" style="display: flex !important;">
        <div class="background"></div>
        <div class="button-container">
            <button id="play-btn" class="game-button">hrať hríčku</button>
            <button id="install-btn" class="game-button">ako nainštalovať PWA</button>
            <button id="refresh-sw-btn" class="game-button">obnoviť service-worker.js</button>
        </div>
    </div>

    <div id="levels-screen" class="screen hidden" style="display: none !important;">
        <button id="back-from-levels-btn" class="back-button">← Späť</button>
        <div class="levels-container">
            <h2 class="levels-title">Vyber si uroven zlatko</h2>
            <div class="levels-grid" id="levelsGrid"></div>
        </div>
    </div>

    <div id="game-screen" class="screen hidden" style="display: none !important;">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
    </div>

    <div id="install-screen" class="screen hidden" style="display: none !important;">
        <button id="back-btn" class="back-button">← späť</button>
        <div class="install-content">
            <img src="./assets/tutinst1.png" alt="Installation step 1" class="install-image">
            <img src="./assets/tutinst2.png" alt="Installation step 2" class="install-image">
            <img src="./assets/tutinst3.png" alt="Installation step 3" class="install-image">
        </div>
    </div>
    
    <script src="plant-selector.js"></script>
    <script src="game.js?v=4"></script>
    <script>
        // Check if running in browser vs installed app
        function isInstalledApp() {
            // Check if PWA is installed/running as standalone app
            if (window.navigator.standalone === true) return true; // iOS
            if (window.matchMedia('(display-mode: standalone)').matches) return true; // Android
            if (window.matchMedia('(display-mode: fullscreen)').matches) return true; // Fullscreen
            return false;
        }

        // Show warning only on home screen and if not installed
        window.addEventListener('load', () => {
            if (!isInstalledApp()) {
                document.body.classList.add('show-warning');
            }
        });

        // Lock to landscape orientation
        if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(err => console.log('Cannot lock orientation:', err));
        }

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js')
                .then(() => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker failed:', err));
        }

        // Prevent zoom
        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('wheel', (e) => {
            if (e.ctrlKey) e.preventDefault();
        }, { passive: false });

        // Get elements
        const homeScreen = document.getElementById('home-screen');
        const levelsScreen = document.getElementById('levels-screen');
        const gameScreen = document.getElementById('game-screen');
        const installScreen = document.getElementById('install-screen');
        const playBtn = document.getElementById('play-btn');
        const installBtn = document.getElementById('install-btn');
        const refreshSwBtn = document.getElementById('refresh-sw-btn');
        const backBtn = document.getElementById('back-btn');
        const backFromLevelsBtn = document.getElementById('back-from-levels-btn');
        const levelsGrid = document.getElementById('levelsGrid');
        const warningBanner = document.getElementById('warning-banner');

        // Generate 15 levels
        function generateLevels() {
            levelsGrid.innerHTML = '';

            for (let i = 1; i <= 15; i++) {
                const levelIndex = i - 1; // 0-indexed for progression checking
                const isUnlocked = plantSelector.isLevelUnlocked(levelIndex);
                const isCompleted = plantSelector.completedLevels.has(levelIndex);
                
                const levelItem = document.createElement('div');
                levelItem.className = isUnlocked ? 'level-item unlocked' : 'level-item locked';
                if (isCompleted) levelItem.classList.add('completed');
                levelItem.setAttribute('data-level', i);
                
                const levelIcon = document.createElement('div');
                levelIcon.className = 'level-icon';
                if (isCompleted) {
                    levelIcon.textContent = '✓';
                } else {
                    levelIcon.textContent = isUnlocked ? i : '🔒';
                }
                
                const levelLabel = document.createElement('div');
                levelLabel.className = 'level-label';
                levelLabel.textContent = 'Úroveň ' + i;
                
                levelItem.appendChild(levelIcon);
                levelItem.appendChild(levelLabel);
                levelsGrid.appendChild(levelItem);

                // Add click handler only if unlocked
                if (isUnlocked) {
                    levelItem.addEventListener('click', () => {
                        showScreen('game');
                        console.log('Starting game...');
                        initGame(i);
                    });
                }
            }
        }

        // Force home screen to show on load
        window.addEventListener('load', () => {
            generateLevels();
            showScreen('home');
        });

        function showScreen(screenName) {
            homeScreen.style.display = 'none';
            levelsScreen.style.display = 'none';
            gameScreen.style.display = 'none';
            installScreen.style.display = 'none';
            homeScreen.classList.add('hidden');
            levelsScreen.classList.add('hidden');
            gameScreen.classList.add('hidden');
            installScreen.classList.add('hidden');

            // Hide warning banner when leaving home screen
            if (screenName !== 'home') {
                warningBanner.style.display = 'none';
                document.body.classList.remove('show-warning');
            } else {
                // Show warning banner only on home screen if not installed
                if (!isInstalledApp()) {
                    warningBanner.style.display = 'block';
                    document.body.classList.add('show-warning');
                }
            }

            if (screenName === 'home') {
                homeScreen.style.display = 'flex';
                homeScreen.classList.remove('hidden');
            } else if (screenName === 'levels') {
                levelsScreen.style.display = 'flex';
                levelsScreen.classList.remove('hidden');
            } else if (screenName === 'game') {
                gameScreen.style.display = 'block';
                gameScreen.classList.remove('hidden');
            } else if (screenName === 'install') {
                installScreen.style.display = 'flex';
                installScreen.classList.remove('hidden');
            }
        }

        // Play button - go to levels screen
        playBtn.addEventListener('click', () => {
            showScreen('levels');
        });

        // Install/Tutorial button
        installBtn.addEventListener('click', () => {
            showScreen('install');
        });

        // Back button - return to home
        backBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            showScreen('home');
        });

        // Back from levels button
        backFromLevelsBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            showScreen('home');
        });

        // Refresh Service Worker and Clear Cache
        refreshSwBtn.addEventListener('click', async () => {
            try {
                // Unregister all service workers
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (let registration of registrations) {
                    await registration.unregister();
                }
                                // Clear all caches
                const cacheNames = await caches.keys();
                for (let cacheName of cacheNames) {
                    await caches.delete(cacheName);
                }

                // Re-register service worker
                await navigator.serviceWorker.register('./service-worker.js');
                
                alert('Service Worker obnovený! Aplikácia sa bude obnovovať.');
                location.reload();
            } catch (err) {
                console.error('Error refreshing Service Worker:', err);
                alert('Chyba pri obnove Service Workera');
            }
        });

        // Expose regenerateLevels globally so game.js can call it
        function regenerateLevels() {
            generateLevels();
        }
    </script>
</body>
</html>
